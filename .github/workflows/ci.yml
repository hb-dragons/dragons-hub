name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_API: http://localhost:9080
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: dragons
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          gcp-workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Lint
        run: pnpm lint

      - name: i18n completeness check
        run: pnpm check:i18n

      - name: Design token check
        run: pnpm check:design-tokens

      - name: Typecheck
        run: pnpm typecheck

      - name: Knip
        run: pnpm knip

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API suite's DB coverage runs on in-process PGlite, but a few modules
    # reach Redis for real: bullmq builds its own ioredis client from the
    # connection URL rather than going through `config/redis`, so importing a
    # worker module opens a socket to 6379. Without this service that socket
    # rejection escapes as an unhandled rejection and fails the job even though
    # every test passes — which is why CI has been red on main since 2026-06-18
    # while local runs (with docker/docker-compose.dev.yml up) were green.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBO_API: http://localhost:9080
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: dragons
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          gcp-workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Test
        run: pnpm test

      - name: Coverage-script check
        run: pnpm check:coverage-scripts

      - name: Skipped-test check
        run: pnpm check:skipped-tests

      - name: Coverage
        run: pnpm coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-reports
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_API: http://localhost:9080
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: dragons
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
          gcp-workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build
        run: pnpm build

  native-doctor:
    # EAS runs `expo doctor` inside the cloud build and fails the whole build
    # on a non-zero exit, so a dependency-graph mistake otherwise costs a
    # 10-20 minute cloud build to discover. Same 20 checks, run here for free.
    name: Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Expo doctor
        run: pnpm --filter @dragons/native check:doctor

  pi:
    name: Pi Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r apps/pi/requirements-dev.txt

      - name: Test
        working-directory: apps/pi
        run: pytest

  ai-slop:
    name: AI Slop Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check for AI slop
        run: node scripts/check-ai-slop.mjs

  lockfile-check:
    name: Lockfile Integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for lockfile poisoning
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'pnpm-lock.yaml'; then
            # pnpm-workspace.yaml counts as a manifest: its `overrides` block is the
            # sanctioned way to lift a transitive dependency past an advisory, and
            # that changes the lockfile without touching any package.json.
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '(^|/)package\.json$|^pnpm-workspace\.yaml$'; then
              echo "::error::pnpm-lock.yaml changed without any package.json or pnpm-workspace.yaml change. This could indicate lockfile poisoning."
              exit 1
            fi
          fi

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/actions/setup

      # The audit itself takes ~2s; anything near this budget means pnpm's
      # local audit path traversal has blown up again (issue #136), not that
      # the registry is slow. Bounding the step rather than the job makes that
      # distinction legible: a step timeout points here, a job timeout points
      # at checkout/install.
      - name: Run vulnerability audit
        timeout-minutes: 2
        run: pnpm security:audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
