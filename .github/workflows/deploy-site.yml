name: Deploy Site

# Public site (hbdragons.de / site.testing.hbdragons.de) — static Astro build
# mirrored over SFTP into a sha-named release dir on the Hetzner webspace, then
# activated by swap.php. See docs/plans/2026-08-01-public-site-migration.md (D1–D3)
# and apps/site/deploy/README.md for the docroot layout.
#
# Deliberately NOT gated on the CI workflow (unlike deploy.yml): the site build
# is its own gate — if `turbo build` fails nothing is uploaded, and the smoke
# test fails the run after a bad swap. Gating on CI would also make content-only
# CMS publishes hostage to unrelated test failures (and to issue #136, where the
# Dependency Audit job times out and CI concludes "cancelled").

on:
  push:
    branches: [main]
    # Native path filters, not .github/scripts/change-patterns.sh: that file
    # exists because deploy.yml runs on `workflow_run`, where GitHub's own path
    # filtering is unavailable and the job has to diff by hand. This workflow
    # triggers on `push` directly, so `paths:` is the cheaper, un-drift-able
    # equivalent — no shell pattern to keep in sync.
    paths:
      - "apps/site/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "packages/api-client/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-site.yml"
  repository_dispatch:
    # cms-publish: Payload publish/unpublish/delete hook (plan task A4).
    # sync-completed: api webhook notification channel (plan task B4).
    types: [cms-publish, sync-completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Existing release sha to swap to (rollback — swap only, no build). Empty = build HEAD."
        required: false
        type: string
  schedule:
    # 03:30 UTC = 04:30 Berlin (winter) / 05:30 (summer) — always after the
    # 04:00 Berlin full sync. Safety net for dropped dispatches.
    - cron: "30 3 * * *"

# Coalescing without a debounce service: one group for every trigger, and
# cancel-in-progress: false. GitHub allows at most one running plus one pending
# run per group — a third arrival replaces the pending one. So a burst of N
# dispatches collapses to <= 2 builds, and the last build always sees the
# newest CMS state (nothing is lost, only redundant middles are dropped).
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `github.event.inputs.sha` is null for push/schedule/repository_dispatch,
      # so this resolves to the build path for every non-manual trigger. The
      # value is read from env (never interpolated into the script body) and
      # validated against swap.php's own regex before it reaches a curl.
      - name: Resolve deploy mode
        id: mode
        env:
          ROLLBACK_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${ROLLBACK_SHA:-}" ]; then
            if [[ ! "$ROLLBACK_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::rollback sha must match ^[0-9a-f]{7,40}\$ (got '$ROLLBACK_SHA')"
              exit 1
            fi
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "sha=$ROLLBACK_SHA" >> "$GITHUB_OUTPUT"
            echo "Rollback: swapping to existing release $ROLLBACK_SHA (no build)"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Build: $GITHUB_SHA (trigger: $GITHUB_EVENT_NAME)"
          fi

      # Fail before touching the host, not halfway through it. The CMS pair
      # matters most: apps/site/src/lib/payload.ts treats *both* vars missing as
      # an "env-less shell build" and only warns, which would publish a site
      # with every collection empty (issue #172).
      - name: Check required configuration
        env:
          BUILD: ${{ steps.mode.outputs.build }}
          CMS_URL: ${{ vars.CMS_URL }}
          CMS_API_TOKEN: ${{ secrets.CMS_API_TOKEN }}
          HETZNER_USER: ${{ vars.HETZNER_USER }}
          HETZNER_HOST: ${{ vars.HETZNER_HOST }}
          HETZNER_SFTP_KEY: ${{ secrets.HETZNER_SFTP_KEY }}
          HETZNER_DEPLOY_TOKEN: ${{ secrets.HETZNER_DEPLOY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          missing=()
          require() { [ -n "${!1:-}" ] || missing+=("$1"); }

          require HETZNER_DEPLOY_TOKEN
          require SITE_URL
          if [ "$BUILD" = "true" ]; then
            require CMS_URL
            require CMS_API_TOKEN
            require HETZNER_USER
            require HETZNER_HOST
            require HETZNER_SFTP_KEY
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing repo secrets/variables: ${missing[*]}"
            exit 1
          fi
          echo "config ok"

      - name: Checkout repository
        if: steps.mode.outputs.build == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Composite action pins pnpm/action-setup + actions/setup-node and runs
      # `pnpm install --frozen-lockfile`. Turbo remote cache stays OFF on
      # purpose: CMS content is not part of turbo's hash inputs, so a cache hit
      # would republish stale content on a cms-publish dispatch.
      - name: Setup
        if: steps.mode.outputs.build == 'true'
        uses: ./.github/actions/setup

      - name: Build site
        if: steps.mode.outputs.build == 'true'
        env:
          CMS_URL: ${{ vars.CMS_URL }}
          CMS_API_TOKEN: ${{ secrets.CMS_API_TOKEN }}
          PUBLIC_API_URL: https://api.app.hbdragons.de
        run: pnpm turbo build --filter @dragons/site

      # index.html and 404.html are emitted whatever the CMS answers, so their
      # presence proves nothing about content. The counts below do: teams/ and
      # news/ pages exist only because getStaticPaths mapped real documents, so
      # an empty (or anonymously-read) CMS fails here, before anything is
      # uploaded and long before the swap (#269).
      - name: Verify build output
        if: steps.mode.outputs.build == 'true'
        env:
          RELEASE_SHA: ${{ steps.mode.outputs.sha }}
        run: |
          set -euo pipefail
          DIST=apps/site/dist
          test -f "$DIST/index.html"
          test -f "$DIST/404.html"

          count_pages() { find "$DIST/$1" -mindepth 2 -name index.html 2>/dev/null | wc -l | tr -d ' '; }
          TEAMS=$(count_pages teams)
          NEWS=$(count_pages news)
          echo "dist: $(find "$DIST" -type f | wc -l) files, $TEAMS team pages, $NEWS news pages"

          if [ "$TEAMS" -lt 1 ] || [ "$NEWS" -lt 1 ]; then
            echo "::error::content-less build (teams=$TEAMS news=$NEWS) — refusing to publish"
            exit 1
          fi
          if ! grep -q 'href="/teams/' "$DIST/index.html"; then
            echo "::error::homepage links no team — the CMS answered without content"
            exit 1
          fi

          # Read back after the swap to identify the live release, which is
          # what the rollback below needs.
          printf '%s\n' "$RELEASE_SHA" > "$DIST/release.txt"

      # SFTP only — this webspace has no ssh, no rsync, and no way to create a
      # symlink remotely (swap.php owns `current`). The docroot `.htaccess` is
      # deliberately NOT uploaded: it is the live-traffic switch, staged as
      # `.htaccess.new` and renamed by the Phase E cutover.
      - name: Upload release over SFTP
        if: steps.mode.outputs.build == 'true'
        env:
          SFTP_KEY: ${{ secrets.HETZNER_SFTP_KEY }}
          SFTP_USER: ${{ vars.HETZNER_USER }}
          SFTP_HOST: ${{ vars.HETZNER_HOST }}
          RELEASE_SHA: ${{ steps.mode.outputs.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

          install -m 600 /dev/null "$HOME/deploy_key"
          printf '%s\n' "$SFTP_KEY" > "$HOME/deploy_key"

          # The password is a placeholder and is never used: ssh authenticates
          # with the key in connect-program. It has to be there anyway — given
          # a user but no password, lftp calls GetPass(), which cannot prompt
          # on a runner, so it gives up and retries as anonymous:
          #   open: GetPass() failed -- assume anonymous login
          #   mirror: Login failed: Password required
          # BatchMode=yes keeps a rejected key failing fast instead of letting
          # ssh wait on a password prompt nobody can answer.
          lftp -u "$SFTP_USER,placeholder-unused" "sftp://$SFTP_HOST" -e "
            set cmd:fail-exit true;
            set sftp:connect-program 'ssh -a -x -i $HOME/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new';
            mirror -R --parallel=4 --delete --exclude-glob .htaccess apps/site/dist public_html/releases/$RELEASE_SHA;
            put -O public_html/releases/$RELEASE_SHA apps/site/deploy/htaccess-release -o .htaccess;
            put -O public_html apps/site/deploy/swap.php;
            bye"

          rm -f "$HOME/deploy_key"

      # The sha that is live right now, so a failed smoke test can put it back.
      # Best-effort: a first deploy, or a release predating release.txt, leaves
      # it empty and the rollback step below becomes a no-op.
      - name: Record the live release
        id: live
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -uo pipefail
          PREVIOUS=$(curl -fsS --max-time 20 "$SITE_URL/release.txt" 2>/dev/null | tr -d '[:space:]' || true)
          if [[ "$PREVIOUS" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "sha=$PREVIOUS" >> "$GITHUB_OUTPUT"
            echo "live release: $PREVIOUS"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "live release: unknown (no usable release.txt) — auto-rollback unavailable"
          fi

      # Always run — this single step is the whole rollback fast path.
      # The apex serves swap.php directly; never call it on the testing subdomain.
      - name: Swap current -> release
        env:
          DEPLOY_TOKEN: ${{ secrets.HETZNER_DEPLOY_TOKEN }}
          RELEASE_SHA: ${{ steps.mode.outputs.sha }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -X POST "https://hbdragons.de/swap.php" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            --data-urlencode "sha=$RELEASE_SHA")
          echo "swap.php: $RESPONSE"
          if [ "$RESPONSE" != "ok $RELEASE_SHA" ]; then
            echo "::error::swap.php did not confirm the release (expected 'ok $RELEASE_SHA')"
            exit 1
          fi

      # Runs on every deploy from day one: the staged release is already
      # browsable at SITE_URL (site.testing.hbdragons.de's docroot is
      # public_html/current), so there is nothing to gate on.
      - name: Smoke test
        id: smoke
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          # Body captured, not piped: `curl | grep -q` makes grep exit on the
          # first match, curl die of SIGPIPE, and `pipefail` fail a green smoke.
          HOMEPAGE=$(curl -fsS --retry 3 --retry-delay 5 --retry-connrefused "$SITE_URL/")
          # Not a case-insensitive grep for "dragons": the NavBar logo alt is
          # "HB Dragons Logo", so that matched a page with no content at all
          # (#269). A team link exists only if the CMS returned teams.
          if ! grep -q 'href="/teams/' <<<"$HOMEPAGE"; then
            echo "::error::homepage at $SITE_URL/ serves no team links — content-less release"
            exit 1
          fi
          # Real 404, not a soft 200 — .htaccess ErrorDocument must be in place.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/definitely-not-a-page/")
          if [ "$STATUS" != "404" ]; then
            echo "::error::expected HTTP 404 for an unknown path, got $STATUS"
            exit 1
          fi
          echo "smoke ok: homepage serves content, unknown path returns a real 404"

      # The swap happens before the smoke test can reach the release — the
      # testing host's docroot *is* current/ — so a failed smoke has to undo
      # it rather than prevent it (#269).
      - name: Roll back a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.live.outputs.sha != ''
        env:
          DEPLOY_TOKEN: ${{ secrets.HETZNER_DEPLOY_TOKEN }}
          PREVIOUS_SHA: ${{ steps.live.outputs.sha }}
        run: |
          set -euo pipefail
          echo "::warning::smoke test failed — swapping back to $PREVIOUS_SHA"
          RESPONSE=$(curl -fsS -X POST "https://hbdragons.de/swap.php" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            --data-urlencode "sha=$PREVIOUS_SHA")
          echo "swap.php: $RESPONSE"
          if [ "$RESPONSE" != "ok $PREVIOUS_SHA" ]; then
            echo "::error::rollback swap failed — the site is still on the bad release"
            exit 1
          fi
          echo "rolled back to $PREVIOUS_SHA"

      - name: Summary
        if: always()
        env:
          RELEASE_SHA: ${{ steps.mode.outputs.sha }}
          BUILT: ${{ steps.mode.outputs.build }}
        run: |
          if [ -z "${RELEASE_SHA:-}" ]; then
            RELEASE_SHA="(unresolved)"
            MODE="(failed before mode resolution)"
          elif [ "${BUILT:-}" = "true" ]; then
            MODE="build + swap"
          else
            MODE="rollback (swap only, no build)"
          fi
          {
            echo "## Site deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`$RELEASE_SHA\` |"
            echo "| Mode | $MODE |"
            echo "| Trigger | \`$GITHUB_EVENT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"
