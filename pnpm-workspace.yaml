packages:
  - apps/*
  - packages/*
overrides:
  # Two copies of a native module fail `expo doctor`, which gates the EAS
  # build. All three are satisfiable by a single version — nothing is being
  # forced past a constraint it declares:
  #   react: packages/shared declares react as a peer at ^19.0.0, which pnpm
  #     auto-installs, resolving to 19.2.4 while every app pins 19.2.6.
  #   react-native: apps/native pins the SDK 57 version, but the expo packages
  #     resolved a second peer variant against a newer patch, which forked most
  #     of the expo-* tree into two copies of each module.
  #   expo-glass-effect: expo-router asks for ^57.0.1 and apps/native pins the
  #     same line, so one copy serves both.
  #   expo-constants: apps/native pins the SDK 57 version while expo-linking
  #     asks for a slightly older patch line, which resolved a second copy of
  #     the module.
  react: 19.2.6
  react-native: 0.86.3
  expo-glass-effect: 57.0.5
  expo-constants: 57.0.23
  # Pinned exactly, so every copy (including the one `@daveyplate/better-auth-ui`
  # pulls in) matches the version the four workspaces declare. Raised from
  # 1.6.23 to 1.7.15 on 2026-11-02 for GHSA-965c-763c-88jm (critical),
  # GHSA-r4xp-prcw-77qf and GHSA-q84f-53jg-9ppm. The 1.6.23 cap (issue #138,
  # client-plugin inference collapse from 1.6.24) is gone: upstream closed
  # better-auth/better-auth#10515 and native typechecks on 1.7.15. 1.7 also made
  # SecondaryStorage require `getAndDelete` + `increment` (apps/api
  # config/auth.ts) and the Expo client's `getCookie()` async. Move all six
  # package.json pins and these two lines together.
  better-auth: 1.7.15
  '@better-auth/expo': 1.7.15
  replace>minimatch: 3.1.5
  '@prisma/dev>hono': '>=4.12.18'
  '@prisma/dev>@hono/node-server': '>=1.19.13'
  tar: '>=7.5.11'
  flatted: '>=3.4.0'
  # Bounded to payload's own major: payload pins undici 7.x, and the open
  # `>=7.24.0` this used to be dragged it onto 8.9.0. 7.29.1 fixes
  # GHSA-rfgv-xxqx-mfg5 and GHSA-w293-vg96-wgc3; 7.30.1 GHSA-xjj6-f33q-929c.
  undici: '>=7.30.1 <8'
  fast-xml-parser: '>=5.7.0'
  fast-xml-builder: '>=1.1.7'
  effect: '>=3.20.0'
  lodash: '>=4.18.0'
  '@xmldom/xmldom': '>=0.8.15 <0.9'
  # GHSA-cjq9-62q9-8jv4 (high): fixed in 16.3.8. Bounded to the minor line
  # the apps pin, not the major: an override wins over a workspace's exact
  # pin, so the `<17` this used to have resolved to the newest 16.x the moment
  # the override changed (16.4.0 while apps/web and apps/cms pinned 16.3.8).
  # Move this bound together with those pins.
  next: '>=16.4.3 <16.5'
  kysely: 0.28.17
  '@tootallnate/once': '>=3.0.1'
  postcss: '>=8.5.18 <9'
  # GHSA-7w5x-hrqm-74c2: DoS via malformed TOML in smol-toml <=1.7.0. Transitive
  # only (knip, @astrojs/internal-helpers); bounded on the right per CLAUDE.md.
  smol-toml: '>=1.7.1 <2'
  # Security floors raised together with the pnpm bump in issue #136 — the
  # audit job had timed out on every run since 2026-08-02, so none of these
  # advisories had ever been reported. Each floor is the lowest patched
  # version GitHub advisories names.
  #
  # `sharp` and `vite` are also declared directly (apps/api, apps/cms). The
  # declared range is what a human reads, so it was raised too; these entries
  # exist because the tree still carried older transitive copies that the
  # declared range does not reach.
  #
  # Every floor is bounded on the right. An open-ended `>=x` is a trap here:
  # pnpm resolves it to the newest release on npm, so `>=1.1.18` on a v1
  # consumer silently dragged minimatch@3 onto brace-expansion@5. Where a
  # package has two live major lines, the floor is scoped per line with a
  # `@^N` selector so a v1 consumer is not dragged onto v5.
  'brace-expansion@^1': '>=1.1.20 <2'
  'brace-expansion@^5': '>=5.0.11 <6'
  fast-uri: '>=3.1.7 <4'
  'form-data@^2': '>=2.5.6 <3'
  ip-address: '>=10.3.1 <11'
  'js-yaml@^3': '>=3.15.1 <4'
  'js-yaml@^4': '>=4.3.2 <5'
  'nanoid@^3': '>=3.3.17 <4'
  'nanoid@^5': '>=5.1.16 <6'
  # browserslist <=4.28.6: unbounded cache growth (OOM) and a prototype write
  # via custom stats, both rated high. Reached only through @babel/core and
  # the expo toolchain; nothing declares it directly.
  browserslist: '>=4.28.7 <5'
  sharp: '>=0.35.5 <0.36'
  shell-quote: '>=1.11.0 <2'
  svgo: '>=3.3.5 <4'
  vite: '>=8.2.4 <9'
  'ws@^7': '>=7.5.11 <8'
  'ws@^8': '>=8.21.0 <9'
  # Floors raised 2026-10-08 for advisories published since the last green
  # audit, each to the lowest patched version GitHub names. All transitive:
  # compression via @expo/cli, source-map-js via postcss/sass/magicast,
  # devalue and http-cache-semantics via astro. `sharp`, `shell-quote` and
  # `next` above were raised in the same pass.
  compression: '>=1.8.2 <2'
  source-map-js: '>=1.2.2 <2'
  devalue: '>=5.9.3 <6'
  http-cache-semantics: '>=4.2.1 <5'
  # Floors raised 2026-10-25, same rule. dompurify via monaco-editor in the
  # Payload admin (GHSA-cg2g-xh64-v4q7 critical, GHSA-mrv2-3pqr-j5jr);
  # happy-dom via better-auth's vitest peer (GHSA-834v-8h66-3h79); the
  # workspaces that declare happy-dom were raised to ^21.0.4 alongside.
  # `next`, `undici` and `vite` above were raised in the same pass.
  dompurify: '>=3.4.17 <4'
  happy-dom: '>=21.0.4 <22'
  # zod GHSA-mrhx-c7xc-m3w5: the declared ranges were raised to ^4.6.7;
  # this reaches the copy @better-auth/core resolves on its own.
  zod: '>=4.6.6 <5'
  # Floors raised 2026-11-02, same rule. node-forge via @expo/cli and
  # @expo/code-signing-certificates (GHSA-7wch-p9px-956x, -jc66-7q78-782g,
  # -8hrf-8g6f-7xwp, -hqq3-7jhf-c5jx, -5x38-2vff-x55p); decode-uri-component
  # GHSA-qr28-fpjm-wq7f. better-auth above was raised in the same pass.
  node-forge: '>=1.4.1 <2'
  decode-uri-component: '>=0.5.1 <0.6'
  '@esbuild-kit/core-utils>esbuild': '>=0.25.0'
  '@instantdb/core>uuid': '>=11.1.1'
auditConfig:
  # `pnpm audit` has no fix for these: both are `<= 2.0.2` and GitHub reports
  # `first_patched_version: null`, while npm's newest image-size is 2.0.2. The
  # package is Metro's, i.e. bundler tooling that never ships, and reaching it
  # needs a hostile ICNS/JXL/HEIF file already in the repo. Tracked in #211 —
  # drop these two the moment upstream publishes a patch.
  #
  # GHSA-vfj7-8cjw-p6xm (braces, high) and GHSA-86w9-cpqp-85rv (node-forge,
  # high): same situation, `first_patched_version: null` and npm's newest
  # release is the vulnerable one. braces arrives through micromatch, which
  # the whole build/test toolchain uses, and only ever expands glob patterns
  # we write; node-forge arrives only through @expo/cli (dev certificates,
  # EAS update signing). Tracked in #376 and #377 respectively.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv

allowBuilds:
  esbuild: true
  '@swc/core': true
  '@parcel/watcher': true
  core-js: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
  # pnpm 11.21 keys git/tarball dependencies by their full spec, so the bare
  # `basketball-bund-sdk: true` this replaces no longer matched anything and
  # the SDK's build scripts were silently skipped. Same intent, spelled the
  # way this pnpm reads it.
  basketball-bund-sdk@https://codeload.github.com/dirkdrutschmann/basketball-bund-sdk/tar.gz/c72789068d9ec5910440f9e2b94f99b6e56d4800: true
  # Its postinstall downloads the sentry-cli binary, which the EAS build hook
  # uses to upload the JS source maps to GlitchTip (#238). Without the build
  # script the package installs an empty shim and the upload step no-ops.
  '@sentry/cli': true

# pnpm's minimum-release-age gate holds back packages published in the last few
# days. The Expo SDK 57 line (issue #213) is younger than that window, so each
# package the upgrade needs is listed here by exact version. pnpm maintains this
# list itself — entries appear when an install needs them, so do not hand-edit.
# Prune an entry once the lockfile no longer resolves that exact version (#231
# dropped the SDK-57.0.12-era set).
minimumReleaseAgeExclude: [ '@expo/cli@57.0.19 || 57.0.20 || 57.0.21 || 57.0.22 || 57.0.23 || 57.0.25', '@expo/inline-modules@0.1.7', '@expo/local-build-cache-provider@57.0.8', '@expo/log-box@57.0.4', '@expo/metro-config@57.0.11 || 57.0.12', '@expo/metro-runtime@57.0.14 || 57.0.15', '@expo/prebuild-config@57.0.15', '@expo/router-server@57.0.8 || 57.0.9 || 57.0.10', babel-preset-expo@57.0.9 || 57.0.10 || 57.0.11 || 57.0.12, expo-asset@57.0.15 || 57.0.16, expo-constants@57.0.15 || 57.0.16 || 57.0.17 || 57.0.18 || 57.0.20, expo-file-system@57.0.6, expo-modules-autolinking@57.0.12, expo-modules-core@57.0.14 || 57.0.15 || 57.0.16 || 57.0.17 || 57.0.20, expo-modules-jsi@57.0.6 || 57.0.7 || 57.0.8 || 57.1.0, expo@57.0.17 || 57.0.18 || 57.0.19 || 57.0.20 || 57.0.21 || 57.0.23 || 57.0.26, '@expo/ui@57.0.14 || 57.0.15 || 57.0.16 || 57.0.17 || 57.0.21', expo-eas-client@57.0.2 || 57.0.3, expo-haptics@57.0.2, expo-linking@57.0.8 || 57.0.9, expo-notifications@57.0.15 || 57.0.16 || 57.0.17 || 57.0.19, expo-router@57.0.17 || 57.0.18 || 57.0.19 || 57.0.20 || 57.0.24, expo-secure-store@57.0.2 || 57.0.3, expo-updates@57.0.18 || 57.0.19 || 57.0.21 || 57.0.24, '@expo/env@2.4.3', '@expo/fingerprint@0.20.11 || 0.20.12', expo-font@57.0.2 || 57.0.3, expo-image@57.0.4, '@expo/metro-file-map@57.0.3', expo-glass-effect@57.0.2 || 57.0.3, '@astrojs/markdown-satteri@0.4.1', astro@7.3.2 ]
